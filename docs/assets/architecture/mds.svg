<svg id="diagram-mds" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="background-color:#fff; max-width: 762px;" viewBox="0 0 762 140" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#diagram-mds{font-family:Arial,sans-serif;font-size:16px;fill:#172d4d;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-mds .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-mds .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-mds .error-icon{fill:#f6f7f9;}#diagram-mds .error-text{fill:#090806;stroke:#090806;}#diagram-mds .edge-thickness-normal{stroke-width:1px;}#diagram-mds .edge-thickness-thick{stroke-width:3.5px;}#diagram-mds .edge-pattern-solid{stroke-dasharray:0;}#diagram-mds .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-mds .edge-pattern-dashed{stroke-dasharray:3;}#diagram-mds .edge-pattern-dotted{stroke-dasharray:2;}#diagram-mds .marker{fill:#627589;stroke:#627589;}#diagram-mds .marker.cross{stroke:#627589;}#diagram-mds svg{font-family:Arial,sans-serif;font-size:16px;}#diagram-mds p{margin:0;}#diagram-mds .label{font-family:Arial,sans-serif;color:#172d4d;}#diagram-mds .cluster-label text{fill:#090806;}#diagram-mds .cluster-label span{color:#090806;}#diagram-mds .cluster-label span p{background-color:transparent;}#diagram-mds .label text,#diagram-mds span{fill:#172d4d;color:#172d4d;}#diagram-mds .node rect,#diagram-mds .node circle,#diagram-mds .node ellipse,#diagram-mds .node polygon,#diagram-mds .node path{fill:#edf4f2;stroke:#577d70;stroke-width:1px;}#diagram-mds .rough-node .label text,#diagram-mds .node .label text,#diagram-mds .image-shape .label,#diagram-mds .icon-shape .label{text-anchor:middle;}#diagram-mds .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram-mds .rough-node .label,#diagram-mds .node .label,#diagram-mds .image-shape .label,#diagram-mds .icon-shape .label{text-align:center;}#diagram-mds .node.clickable{cursor:pointer;}#diagram-mds .root .anchor path{fill:#627589!important;stroke-width:0;stroke:#627589;}#diagram-mds .arrowheadPath{fill:#000000;}#diagram-mds .edgePaths .path{stroke:#627589;stroke-width:1px;}#diagram-mds .flowchart-link{stroke:#627589;fill:none;}#diagram-mds .edgeLabel{background-color:#ffffff;text-align:center;}#diagram-mds .edgeLabel p{background-color:#ffffff;}#diagram-mds .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram-mds .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#diagram-mds .cluster rect{fill:#f4f7fa;stroke:#ccd7e2;stroke-width:1px;}#diagram-mds .cluster text{fill:#090806;}#diagram-mds .cluster span{color:#090806;}#diagram-mds .node .collapsed-indicator{fill:#ccd7e2;stroke:none;opacity:0.6;}#diagram-mds .node .collapsed-separator{stroke:#ccd7e2;stroke-width:0.75px;}#diagram-mds div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,sans-serif;font-size:12px;background:#f6f7f9;border:1px solid hsl(220, 0%, 87.0588235294%);border-radius:2px;pointer-events:none;z-index:100;}#diagram-mds .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172d4d;}#diagram-mds rect.text{fill:none;stroke-width:0;}#diagram-mds .icon-shape,#diagram-mds .image-shape{background-color:#ffffff;text-align:center;}#diagram-mds .icon-shape p,#diagram-mds .image-shape p{background-color:#ffffff;padding:2px;}#diagram-mds .icon-shape .label rect,#diagram-mds .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram-mds .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#diagram-mds .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#diagram-mds .node .neo-node{stroke:#577d70;}#diagram-mds [data-look="neo"].node rect,#diagram-mds [data-lo